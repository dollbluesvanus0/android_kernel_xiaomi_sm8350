name: Build Kernel and AnyKernel3

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out kernel source
        uses: actions/checkout@v4
        with:
          path: kernel_source

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison build-essential libelf-dev libssl-dev bc wget curl zip unzip cpio zstd gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup Clang
        run: |
          mkdir -p clang
          cd clang
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.2/clang+llvm-17.0.2-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          tar -xf clang+llvm-17.0.2-x86_64-linux-gnu-ubuntu-22.04.tar.xz --strip-components=1
          cd ..
          echo "${PWD}/clang/bin" >> $GITHUB_PATH

      - name: Integrate ReSukiSU
        run: |
          cd kernel_source
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
          echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/lahaina-qgki_defconfig


      - name: Build Kernel
        run: |
          cd kernel_source
          export PATH="${PWD}/../clang/bin:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LLVM=1
          export LLVM_IAS=1

          make O=out vendor/lahaina-qgki_defconfig
          make O=out -j4

      - name: Setup AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          sed -i 's/device.name1=maguro/device.name1=venus/' anykernel.sh
          sed -i 's/device.name2=toro/device.name2=star/' anykernel.sh
          sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot/block=\/dev\/block\/bootdevice\/by-name\/boot/' anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/' anykernel.sh
          cp ../kernel_source/out/arch/arm64/boot/Image.gz .
          cat ../kernel_source/out/arch/arm64/boot/dts/vendor/qcom/*.dtb > dtb || true
          zip -r9 ../AnyKernel3-ReSukiSU.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-ReSukiSU
          path: AnyKernel3-ReSukiSU.zip
