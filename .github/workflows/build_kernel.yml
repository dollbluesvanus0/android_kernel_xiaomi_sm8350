name: Build Kernel and AnyKernel3

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out kernel source
        uses: actions/checkout@v4
        with:
          path: kernel_source

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison build-essential libelf-dev libssl-dev bc wget curl zip unzip cpio zstd

      - name: Setup Clang 17.0.2
        run: |
          mkdir -p clang
          cd clang
          wget -q https://gitlab.com/Panchajanya1999/azure-clang/-/raw/main/clang-17.0.2.tar.gz || wget -q https://github.com/ZyC-X/zyc-clang/releases/download/v17.0.2-1/zyc-clang-17.0.2.tar.gz || true
          if [ -f clang-17.0.2.tar.gz ]; then
            tar -xf clang-17.0.2.tar.gz
          elif [ -f zyc-clang-17.0.2.tar.gz ]; then
            tar -xf zyc-clang-17.0.2.tar.gz
          else
             wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r487747c.tar.gz || true
             tar -xf clang-r487747c.tar.gz || true

             wget -q https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
             chmod +x antman
             ./antman -S
          fi
          cd ..
          echo "${PWD}/clang/bin" >> $GITHUB_PATH

      - name: Integrate ReSukiSU
        run: |
          cd kernel_source
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
          echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/lahaina-qgki_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/vendor/lahaina-qgki_defconfig

      - name: Build Kernel
        run: |
          cd kernel_source
          export PATH="${PWD}/../clang/bin:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LLVM=1
          export LLVM_IAS=1

          make O=out vendor/lahaina-qgki_defconfig
          make O=out -j$(nproc)

      - name: Setup AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          sed -i 's/device.name1=maguro/device.name1=venus/' anykernel.sh
          sed -i 's/device.name2=toro/device.name2=star/' anykernel.sh
          sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot/block=\/dev\/block\/bootdevice\/by-name\/boot/' anykernel.sh
          cp ../kernel_source/out/arch/arm64/boot/Image .
          zip -r9 ../AnyKernel3-ReSukiSU.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-ReSukiSU
          path: AnyKernel3-ReSukiSU.zip
